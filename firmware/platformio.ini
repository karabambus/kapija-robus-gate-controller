; PlatformIO configuration — gate-opener controller
; Board: Joy-it NodeMCU-ESP32 (generic ESP32-WROOM devkit)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; Uncomment and adjust if auto-detection picks the wrong port:
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

; --- OTA upload over WiFi (after the first USB flash) ---
; Uncomment the three lines below; --auth must match OTA_PASSWORD in config.h.
; With WIFI_AP_MODE true: join the ESP32's own network first and use
; upload_port = 192.168.4.1 (mDNS may not resolve on the AP network).
; upload_protocol = espota
; upload_port = kapija.local
; upload_flags = --auth=change-me-too
