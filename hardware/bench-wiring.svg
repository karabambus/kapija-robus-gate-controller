<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="sans-serif">
  <defs>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:10}
      .title{font-size:15px;font-weight:bold;fill:#0f172a}
      .pin{font-size:12px;fill:#0f172a}
      .note{font-size:11px;fill:#64748b}
      .warn{font-size:12px;fill:#b91c1c;font-weight:bold}
      .w{fill:none;stroke-width:3;stroke-linejoin:round}
      .dot{fill:#0f172a}
    </style>
  </defs>

  <rect width="960" height="640" fill="#ffffff"/>
  <text x="20" y="30" class="title" font-size="18">BENCH WIRING — desk test, USB powered (no gate, no 33 V)</text>
  <text x="20" y="50" class="note">Goal: web button clicks the relay; test wire touched to GND flips the app to "OTVORENA".</text>
  <text x="20" y="68" class="note">Legend: ● = connection (junction). Lines crossing WITHOUT ● are NOT connected — they just pass over each other.</text>

  <!-- ESP32 board -->
  <rect x="40" y="120" width="220" height="320" class="box" rx="10"/>
  <text x="60" y="145" class="title">Joy-it ESP32</text>
  <text x="60" y="162" class="note">NodeMCU DevKit</text>
  <text x="60" y="188" class="note">◄ micro-USB to PC</text>
  <circle cx="260" cy="230" r="4" class="dot"/><text x="185" y="234" class="pin">VIN (5V)</text>
  <circle cx="260" cy="280" r="4" class="dot"/><text x="200" y="284" class="pin">GND</text>
  <circle cx="260" cy="340" r="4" class="dot"/><text x="182" y="344" class="pin">GPIO 26</text>
  <circle cx="260" cy="400" r="4" class="dot"/><text x="182" y="404" class="pin">GPIO 27</text>

  <!-- Relay module -->
  <rect x="600" y="110" width="260" height="160" class="box" rx="10"/>
  <text x="620" y="135" class="title">COM-RM01 relay</text>
  <circle cx="600" cy="160" r="4" class="dot"/><text x="612" y="164" class="pin">+ (5V)</text>
  <circle cx="600" cy="200" r="4" class="dot"/><text x="612" y="204" class="pin">− (GND)</text>
  <circle cx="600" cy="240" r="4" class="dot"/><text x="612" y="244" class="pin">S (signal)</text>
  <text x="760" y="164" class="pin">COM ○</text>
  <text x="760" y="204" class="pin">NO&#160;&#160;○</text>
  <text x="760" y="244" class="pin">NC&#160;&#160;○</text>
  <text x="700" y="290" class="note">COM/NO stay unconnected on the bench —</text>
  <text x="700" y="305" class="note">listen for the click or check continuity.</text>

  <!-- PC817, drawn in REAL orientation: text readable, anode dot top-left -->
  <rect x="600" y="360" width="260" height="150" class="box" rx="10"/>
  <circle cx="618" cy="380" r="6" fill="#0f172a"/>
  <text x="634" y="385" class="title">PC817 optocoupler</text>
  <circle cx="600" cy="410" r="4" class="dot"/><text x="612" y="414" class="pin">1 A (anode)</text>
  <circle cx="600" cy="460" r="4" class="dot"/><text x="612" y="464" class="pin">2 K (cathode)</text>
  <circle cx="860" cy="410" r="4" class="dot"/><text x="756" y="414" class="pin">(collector) C 4</text>
  <circle cx="860" cy="460" r="4" class="dot"/><text x="766" y="464" class="pin">(emitter) E 3</text>
  <text x="620" y="498" class="note">Drawn like the real chip: ● top-left = pin 1.</text>

  <!-- 5V wire: VIN -> relay VCC, branch direct to PC817 A -->
  <polyline class="w" stroke="#ea580c" points="260,230 460,230 460,160 600,160"/>
  <polyline class="w" stroke="#ea580c" points="460,230 460,90 560,90 560,410 600,410"/>
  <circle cx="460" cy="230" r="5" class="dot"/>

  <!-- GND wire: GND -> relay GND, bus down to E and button -->
  <polyline class="w" stroke="#0f172a" points="260,280 520,280 520,200 600,200"/>
  <polyline class="w" stroke="#0f172a" points="520,280 520,580 920,580"/>
  <circle cx="520" cy="280" r="5" class="dot"/>
  <!-- E (right side) to GND bus -->
  <polyline class="w" stroke="#0f172a" points="860,460 920,460 920,580"/>
  <circle cx="920" cy="580" r="5" class="dot"/>

  <!-- K (left side) -> 680R resistor -> test wire -> GND bus -->
  <polyline class="w" stroke="#7c3aed" points="600,460 545,460 545,470"/>
  <rect x="530" y="470" width="30" height="30" fill="#fde68a" stroke="#a16207" stroke-width="2"/>
  <text x="455" y="490" class="pin">680 Ω</text>
  <polyline class="w" stroke="#7c3aed" points="545,500 545,512"/>
  <rect x="530" y="512" width="30" height="46" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="443" y="532" class="pin" fill="#7c3aed">test wire</text>
  <text x="443" y="546" class="pin" fill="#7c3aed">(→ GND)</text>
  <polyline class="w" stroke="#7c3aed" points="545,558 545,580"/>
  <circle cx="545" cy="580" r="5" class="dot"/>

  <!-- GPIO26 -> IN -->
  <polyline class="w" stroke="#2563eb" points="260,340 440,340 440,240 600,240"/>
  <!-- GPIO27 -> C (right side), routed below everything -->
  <polyline class="w" stroke="#16a34a" points="260,400 300,400 300,620 940,620 940,410 860,410"/>

  <text x="40" y="560" class="warn">Order: wire everything → double-check → only then plug in USB.</text>
  <text x="40" y="580" class="note">Test wire in GND = LED on = "gate open" (S.C.A.).</text>
  <text x="40" y="600" class="note">If the relay clicks ON at boot: set RELAY_ACTIVE_HIGH false in config.h.</text>
</svg>
